<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Stopwatch UI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./watchDesgin.css">

</head>
<body>

  <div class="stopwatch-container">
    <div class="stopwatch-title">⏱️ Stopwatch</div>
    <div class="display-time" id="displayTime">00:00:00</div>
    <div class="d-flex justify-content-center">
      <button class="btn btn-danger btn-custom" onclick="stop()">Stop</button>
      <button class="btn btn-success btn-custom" onclick="start()">Start</button>
      <button class="btn btn-warning btn-custom" onclick="reset()">Reset</button>
    </div>
  </div>

  <script src="./watchLogic.js"></script>

</body>
</html>
